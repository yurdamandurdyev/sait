function calculate(p){if(p.age<18||p.age>90||p.height<120||p.height>230||p.weight<35||p.weight>250)throw new Error('Проверь возраст, рост и вес. Расчёт доступен для взрослых от 18 лет.');const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161);const maintenance=Math.round(bmr*Number(p.activity));const calories=Math.max(p.sex==='male'?1500:1200,Math.round((maintenance+(p.goal==='lose'?-350:p.goal==='gain'?250:0))/10)*10);const protein=Math.round(p.weight*(p.goal==='gain'?1.8:1.6));const fat=Math.round(p.weight*.9);return {bmr:Math.round(bmr),maintenance,calories,protein,fat,carbs:Math.max(0,Math.round((calories-protein*4-fat*9)/4)),water:Math.round(p.weight*30/100)/10};}

function dayMeals(p,day=0){const lunch=p.diet==='vegetarian'?4:(day%2?4:0);const dinner=p.diet==='vegetarian'?4:2;const chosen=[1,lunch,3,dinner].map(id=>recipes[id]);const scale=calculate(p).calories/chosen.reduce((sum,r)=>sum+r.kcal,0);return chosen.map(r=>({...r,kcal:Math.round(r.kcal*scale),protein:Math.round(r.protein*scale),ingredients:r.ingredients.map(([n,a,u])=>[n,Math.round(a*scale),u]),scale}));}
function shopping(p){const totals=new Map();for(let d=0;d<7;d++)for(const recipe of dayMeals(p,d))for(const [name,amount,unit]of recipe.ingredients){const key=name+unit;const item=totals.get(key)||{name,amount:0,unit};item.amount+=amount;totals.set(key,item)}return [...totals.values()];}

const top=(title,subtitle)=>`<div class="page-top"><div><div class="eyebrow">ТВОЙ ПУТЬ К БАЛАНСУ</div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="date-chip">◷ &nbsp; ${new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div></div>`;
function recipeCard(r){return `<button class="recipe" data-recipe="${r.id}"><div class="recipe-photo"><img src="${image(r)}" alt="${r.name}" loading="lazy"><span class="photo-tag">${r.tag}</span></div><div class="recipe-info"><h3>${r.name}</h3><p><span>◷ ${r.time} мин</span><span>♨ ${r.kcal} ккал</span><span>Б ${r.protein} г →</span></p></div></button>`}
function overview(){const c=calculate(profile),meals=dayMeals(profile),eaten=log.meals.reduce((s,i)=>s+(meals[i]?.kcal||0),0);const percent=Math.min(100,eaten/c.calories*100);return `${top(`Хороший день, ${escape(profile.name)} <span style="font-weight:400">✳</span>`,'Становись сильнее. Питайся осознанно. Чувствуй себя лучше.')}
<section class="hero"><div class="hero-lines"></div><div class="hero-copy"><div class="eyebrow">НЕ ПРОСТО ЦИФРЫ. ТВОЙ ОБРАЗ ЖИЗНИ.</div><h2>В лучшей форме.<br><em>В своём ритме.</em></h2><p>Питание и тренировки, которые подходят именно тебе.<br>Без крайностей. С заботой о себе.</p><button class="primary" data-page="profile">Мой персональный план <span>→</span></button></div><div class="hero-art" aria-label="Анимированная объёмная композиция"><div class="art-star">✳</div><div class="orbit"></div><div class="sphere"></div><div class="sphere small"></div><div class="art-label">✦ &nbsp; Баланс начинается с тебя</div></div></section>
<div class="stats"><article class="stat"><div class="stat-head">Дневная норма <span class="stat-icon">♨</span></div><div class="stat-value">${fmt(c.calories)} <small>ккал</small></div><div class="stat-foot"><span class="positive">→</span> ${profile.goal==='lose'?'Для снижения веса':profile.goal==='gain'?'Для набора массы':'Для поддержания веса'}</div><div class="progress"><i style="width:72%"></i></div></article><article class="stat"><div class="stat-head">Белок на день <span class="stat-icon">◈</span></div><div class="stat-value">${c.protein} <small>грамм</small></div><div class="stat-foot">Основа твоего восстановления</div><div class="progress"><i style="width:57%;background:#d2c5a8"></i></div></article><article class="stat"><div class="stat-head">Водный баланс <span class="stat-icon">♧</span></div><div class="stat-value">${log.water.toFixed(1)} <small>/ ${c.water} л</small></div><div class="water-buttons"><button id="water-add">+ 250 мл</button><button id="water-reset" aria-label="Сбросить воду">↺</button></div></article><article class="stat"><div class="stat-head">Тренировки <span class="stat-icon">⌁</span></div><div class="stat-value">${log.workout?1:0} <small>сегодня</small></div><div class="stat-foot"><span class="positive">✦</span> План: 3 раза в неделю</div><div class="progress"><i style="width:${log.workout?100:0}%"></i></div></article></div>
<div class="columns"><section class="panel"><div class="section-head"><h2>Питание сегодня</h2><button class="text-button" data-page="food">Мой рацион →</button></div><div class="nutrition-body"><div class="ring" style="background:conic-gradient(#b6d98c 0 ${percent}%,#e9eedf ${percent}% 100%)"><div class="ring-content"><small>Съедено</small><strong>${fmt(eaten)}</strong><span>из ${fmt(c.calories)} ккал</span></div></div><div class="macro-list">${[['Белки',c.protein,'#b6d98c'],['Жиры',c.fat,'#d2c5a8'],['Углеводы',c.carbs,'#c7d1b5']].map(([n,v,col])=>`<div><div class="macro-row"><span><i class="macro-dot" style="background:${col}"></i>${n}</span><b>${v} г</b></div><div class="progress"><i style="width:${percent}%;background:${col}"></i></div></div>`).join('')}</div></div><div class="tip"><span>✧</span> ${eaten?'Отличный шаг! Добавь следующий приём пищи в рационе.':'Отметь первый приём пищи — и твой баланс оживёт.'}</div></section><section class="panel"><div class="section-head"><h2>Время для движения</h2><button class="text-button" data-page="training">Все тренировки →</button></div><div class="training-card"><span class="pill">СИЛА & БАЛАНС</span><h3>Сильнее с каждым днём</h3><p>◷ 35–45 минут &nbsp; · &nbsp; Всё тело</p><button class="play" data-page="training" aria-label="Открыть тренировку">→</button></div><div class="training-bottom"><span>Твой план на неделю</span><div class="week-dots">${['П','В','С','Ч','П','С','В'].map((d,i)=>`<span class="${[0,2,4].includes(i)?'done':''}">${d}</span>`).join('')}</div><strong>3 занятия</strong></div></section></div>
<section class="recipes-block"><div class="section-head"><div><h2>Полезно. И очень вкусно.</h2><p>Простые рецепты для твоих больших целей</p></div><button class="text-button" data-page="recipes">Все рецепты →</button></div><div class="recipe-grid">${[meals[1],meals[0],meals[3]].map(recipeCard).join('')}</div></section><div class="bottom-banner"><span class="bag">⌑</span><div><h3>Вся неделя — в одной корзине</h3><p>Список продуктов уже собран по твоему плану питания.</p></div><button data-page="basket">Открыть корзину →</button></div>`}
function profilePage(){const c=calculate(profile);const input=(label,key,min,max,step=1)=>`<label class="field">${label}<input name="${key}" type="number" min="${min}" max="${max}" step="${step}" value="${profile[key]}" required></label>`;const select=(label,key,values)=>`<label class="field">${label}<select name="${key}">${values.map(([v,t])=>`<option value="${v}" ${String(profile[key])===String(v)?'selected':''}>${t}</option>`).join('')}</select></label>`;return `${top('Всё начинается с тебя','Расскажи о себе — мы подстроим план под твою жизнь.')}<div class="profile-layout"><form class="panel" id="profile-form"><div class="form-grid"><label class="field">Как тебя зовут?<input name="name" maxlength="30" value="${escape(profile.name)}" required></label>${input('Возраст, лет','age',18,90)}${select('Пол для расчёта обмена','sex',[['male','Мужской'],['female','Женский']])}${input('Рост, см','height',120,230)}${input('Вес, кг','weight',35,250,.1)}${select('Телосложение','body',[['lean','Худощавое'],['average','Среднее'],['large','Крупное']])}${select('Образ жизни','activity',[[1.2,'Сидячий'],[1.375,'Лёгкая активность'],[1.55,'Умеренная активность'],[1.725,'Высокая активность']])}${select('Твоя цель','goal',[['lose','Снизить вес'],['maintain','Поддерживать форму'],['gain','Набрать массу']])}${select('Опыт тренировок','level',[['beginner','Начинающий'],['experienced','Есть опыт']])}${select('Предпочтения в питании','diet',[['all','Ем всё'],['vegetarian','Без мяса и рыбы (лакто-вегетарианское)']])}</div><p id="form-error" class="error" role="alert"></p><div class="form-actions"><button class="primary" type="submit">Сохранить и обновить план →</button></div><p class="notice">Данные хранятся только в этом браузере. Изменение профиля обновит порции и сбросит сегодняшние отметки еды.</p></form><aside class="summary-card"><div class="eyebrow">ТВОЙ ОРИЕНТИР</div><strong>${fmt(c.calories)}</strong><span>ккал в день</span><h3>Баланс, который подходит тебе</h3><p>Базовый обмен: ${fmt(c.bmr)} ккал.<br>С учётом активности: ${fmt(c.maintenance)} ккал.<br>Белки ${c.protein} г · жиры ${c.fat} г · углеводы ${c.carbs} г.</p><p>Используем формулу Миффлина — Сан Жеора. Телосложение помогает подобрать темп и нагрузку, но не заменяет измерение состава тела и не меняет формулу.</p><p>Это приблизительный ориентир для взрослых, а не медицинское назначение. При беременности, хронических заболеваниях или особых потребностях план стоит согласовать со специалистом.</p></aside></div>`}
function food(){const meals=dayMeals(profile,day),total=meals.reduce((s,r)=>s+r.kcal,0);return `${top('Питание в твоём ритме','Готовый план на неделю с порциями под твою норму калорий.')}<div class="tabs">${['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map((d,i)=>`<button data-day="${i}" class="${day===i?'selected':''}">${d}</button>`).join('')}</div><div class="panel"><div class="section-head"><h2>${['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'][day]}</h2><span class="badge">${fmt(total)} ккал за день</span></div>${meals.map((r,i)=>`<article class="meal"><img src="${image(r)}" alt="${r.name}"><div><div class="eyebrow">${['Завтрак','Обед','Перекус','Ужин'][i]}</div><h3>${r.name}</h3><p>${r.kcal} ккал · белок ${r.protein} г · ${r.time} мин</p></div><button class="text-button" data-meal-recipe="${i}">Рецепт →</button>${day===0?`<button class="primary" data-eat="${i}">${log.meals.includes(i)?'✓ Съедено':'+ Съедено'}</button>`:''}</article>`).join('')}<p class="notice">Отметки относятся к сегодняшнему рациону на первой вкладке. Порции рассчитаны пропорционально дневной норме; фактическая калорийность зависит от продуктов. Учитывай аллергии и переносимость ингредиентов.</p></div>`}
const workouts={gym:[['Приседания с гантелью','3 × 10'],['Жим гантелей лёжа','3 × 10'],['Тяга верхнего блока','3 × 12'],['Румынская тяга с гантелями','3 × 10'],['Планка','3 × 30 сек']],body:[['Приседания','3 × 12'],['Отжимания от высокой опоры','3 × 8'],['Обратные выпады','3 × 8 на ногу'],['Ягодичный мост','3 × 15'],['Мёртвый жук','3 × 10']],home:[['Приседания к стулу','3 × 12'],['Отжимания от стены','3 × 10'],['Тяга резинки к поясу','3 × 12'],['Ягодичный мост','3 × 15'],['Боковая планка с колен','3 × 20 сек']]};
function training(){return `${top('Движение, которое вдохновляет','Выбери своё пространство. Мы позаботимся о плане.')}<div class="tabs">${[['gym','В зале · с железом'],['body','С собственным весом'],['home','Дома']].map(([m,n])=>`<button data-mode="${m}" class="${mode===m?'selected':''}">${n}</button>`).join('')}</div><section class="full-training"><span class="badge">${profile.level==='beginner'?'Начальный уровень':'Средний уровень'} · ${profile.goal==='gain'?'Сила и рост мышц':profile.goal==='lose'?'Сила и активность':'Сила и баланс'}</span><h3>Всё тело. Один шаг вперёд.</h3><p class="notice">${mode==='gym'?'Оборудование: гантели, скамья и блочный тренажёр.':mode==='home'?'Оборудование: устойчивый стул, коврик и эластичная резинка.':'Оборудование: коврик и устойчивая опора.'} Начни с 5–7 минут разминки. Отдых между подходами 60–90 секунд.</p>${workouts[mode].map(([n,reps])=>`<div class="exercise"><b>${n}</b><span>${profile.level==='experienced'?reps.replace('3 ×','4 ×'):profile.body==='large'?reps.replace('3 ×','2 ×'):reps}</span></div>`).join('')}<p class="notice">Оставляй 2–3 повторения в запасе. Начни с комфортной нагрузки и постепенно повышай её. ${profile.goal==='lose'?'Добавь 20–30 минут спокойной ходьбы в дни отдыха.':profile.goal==='gain'?'Если все подходы даются уверенно, на следующей неделе немного увеличь вес или повторения.':'В дни отдыха подойдут прогулки и лёгкая подвижность.'} При боли остановись.</p><button class="primary" id="start-workout">Начать тренировку ▷</button></section><div class="workout-days">${[['Понедельник','Силовая · всё тело'],['Среда','Силовая · техника'],['Пятница','Силовая · прогресс']].map(([d,n])=>`<article class="day-card"><div class="eyebrow">${d}</div><h3>${n}</h3><p>35–45 минут. Между силовыми занятиями — день восстановления.</p></article>`).join('')}</div>`}
function recipesPage(){let list=recipes.filter(r=>recipeFilter==='Все'||r.tag===recipeFilter).filter(r=>profile.diet!=='vegetarian'||![0,2].includes(r.id));return `${top('Еда, которую хочется готовить','Простые ингредиенты. Яркие вкусы. Забота в каждой тарелке.')}<div class="tabs">${['Все','Завтрак','Обед','Ужин','Перекус'].map(t=>`<button data-filter="${t}" class="${recipeFilter===t?'selected':''}">${t}</button>`).join('')}</div><div class="recipe-grid">${list.map(recipeCard).join('')}</div>${!list.length?'<div class="empty">В этой категории пока нет рецептов для выбранного питания. Попробуй категорию «Обед».</div>':''}<p class="notice">В каталоге указана базовая порция. В плане питания порции адаптируются под твой профиль.</p>`}
function basket(){const items=shopping(profile);return `${top('Твоя корзина на неделю','Всё для семи дней сбалансированного питания. Без лишних покупок.')}<div class="panel"><div class="section-head"><h2>${items.length} продуктов · 1 человек</h2><button class="primary" id="download-basket">Скачать список ↓</button></div>${items.map((r,i)=>`<label class="basket-item"><input type="checkbox" data-check="${escape(r.name)}" ${checked.includes(r.name)?'checked':''}><b>${r.name}</b><span>${fmt(r.amount)} ${r.unit}</span></label>`).join('')}<p class="notice">Количество рассчитано из всех рецептов недельного меню с учётом твоих порций. Вес круп указан в сухом виде, нут — готовый. Соль, специи и вода не включены; округли покупки до доступных упаковок.</p><button class="text-button" id="reset-basket">Сбросить отметки ↺</button></div>`}
function render(){document.querySelector('#content').innerHTML=({overview,profile:profilePage,food,training,recipes:recipesPage,basket})[page]();document.querySelector('#crumb').textContent=names[page];document.querySelector('#account-name').textContent=profile.name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),2800)}
function modal(html){document.querySelector('#modal-content').innerHTML=html;document.querySelector('#modal').hidden=false;document.body.style.overflow='hidden';document.querySelector('.close').focus()}
function close(){document.querySelector('#modal').hidden=true;document.body.style.overflow='';if(timerId)clearInterval(timerId)}
function showRecipe(r){modal(`<img class="modal-photo" src="${image(r)}" alt="${r.name}"><h2>${r.name}</h2><span class="badge">${r.kcal} ккал · ${r.time} мин · белок ${r.protein} г</span><h3>Ингредиенты на порцию</h3>${r.ingredients.map(([n,a,u])=>`<div class="exercise"><b>${n}</b><span>${a} ${u}</span></div>`).join('')}<h3>Как приготовить</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;location.hash=page;render();window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.recipe!==undefined)showRecipe(recipes[Number(b.dataset.recipe)]);if(b.dataset.mealRecipe!==undefined)showRecipe(dayMeals(profile,day)[Number(b.dataset.mealRecipe)]);if(b.dataset.day!==undefined){day=Number(b.dataset.day);render()}if(b.dataset.mode){mode=b.dataset.mode;render()}if(b.dataset.filter){recipeFilter=b.dataset.filter;render()}if(b.dataset.eat!==undefined){const i=Number(b.dataset.eat);log.meals=log.meals.includes(i)?log.meals.filter(v=>v!==i):[...log.meals,i];save();render()}if(b.id==='water-add'){log.water=Math.round((log.water+.25)*100)/100;save();render();toast('Добавлено 250 мл воды')}if(b.id==='water-reset'){log.water=0;save();render()}if(b.id==='reset-basket'){checked=[];save();render()}if(b.id==='download-basket'){const text='FORMA · Корзина на 7 дней\n\n'+shopping(profile).map(r=>`${r.name} — ${r.amount} ${r.unit}`).join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='forma-shopping.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Список продуктов скачан')}if(b.id==='help')modal('<div class="eyebrow">ПРИВЕТ, ЭТО FORMA</div><h2>Твой ритм. Твоя форма.</h2><p>Заполни профиль, чтобы получить расчёт калорий и персональные порции. Отмечай еду и воду, выбирай тренировки и скачивай список покупок.</p><p>Расчёты приблизительные. Приложение не учитывает заболевания и не заменяет индивидуальную консультацию. Все данные сохраняются локально в браузере.</p>');if(b.classList.contains('close'))close();if(b.id==='start-workout'){let seconds=0;modal(`<div class="eyebrow">ВРЕМЯ ДЛЯ СЕБЯ</div><h2>Тренировка началась</h2><p>Начни с разминки. Двигайся в комфортном темпе, следи за техникой и отдыхай между подходами.</p><div class="timer" id="timer">00:00</div><button class="primary" id="finish-workout">Завершить и сохранить ✓</button>`);timerId=setInterval(()=>{seconds++;const el=document.querySelector('#timer');if(el)el.textContent=`${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')}`},1000)}if(b.id==='finish-workout'){log.workout=true;save();close();render();toast('Тренировка сохранена. Отличная работа!')}});
document.addEventListener('change',e=>{if(e.target.dataset.check){const key=e.target.dataset.check;checked=e.target.checked?[...checked,key]:checked.filter(v=>v!==key);save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='profile-form')return;e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const key of ['age','height','weight','activity'])data[key]=Number(data[key]);data.name=data.name.trim();try{if(!data.name)throw new Error('Укажи имя.');calculate(data);profile=data;log.meals=[];checked=[];save();render();toast('Твой персональный план обновлён')}catch(err){document.querySelector('#form-error').textContent=err.message}});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!document.querySelector('#modal').hidden){const elements=[...document.querySelectorAll('#modal button, #modal a, #modal input')];const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('hashchange',()=>{const key=location.hash.slice(1);if(names[key]&&page!==key){page=key;render()}});if(names[location.hash.slice(1)])page=location.hash.slice(1);render();

document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-label',names[b.dataset.page]));

})();
</script></body></html>
