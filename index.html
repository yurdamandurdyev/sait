const mealTags=['Завтрак','Обед','Перекус','Ужин'];
function candidates(p,tag){return recipes.filter(r=>r.tag===tag&&(p.diet!=='vegetarian'||r.vegetarian))}
function dayMeals(p,day=0){
 const version=Number(p.menuVersion)||0;
 const chosen=mealTags.map((tag,slot)=>{
  const options=candidates(p,tag);const override=p.mealOverrides?.[`${day}-${slot}`];
  return options.find(r=>r.id===override)||options[(day+version*3+slot*3)%options.length];
 });
 const scale=calculate(p).calories/chosen.reduce((sum,r)=>sum+r.kcal,0);
 return chosen.map(r=>({...r,kcal:Math.round(r.kcal*scale),protein:Math.round(r.protein*scale),fat:Math.round(r.fat*scale),carbs:Math.round(r.carbs*scale),ingredients:r.ingredients.map(([n,a,u])=>[n,Math.round(a*scale),u]),scale}));
}

 for(let d=0;d<7;d++)for(const recipe of dayMeals(p,d))for(const [name,amount,unit]of recipe.ingredients){
  const key=name+unit;const item=totals.get(key)||{name,amount:0,unit};item.amount+=amount;totals.set(key,item);
 }
 return [...totals.values()].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

function localDate(date=new Date()){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
function mondayDate(offset=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7+offset*7);return localDate(d)}
function addDays(date,n){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+n);return localDate(d)}
function availableEquipment(p,mode=p.trainingMode||'gym'){const allowed=mode==='body'?['mat','chair','pullup']:mode==='home'?['dumbbells','bench','bands','pullup','chair','mat']:Object.keys(equipmentNames);return (p.equipmentByMode?.[mode]||defaultEquipment[mode]||[]).filter(e=>allowed.includes(e))}
function allowedExercises(p,mode=p.trainingMode||'gym'){
 const eq=availableEquipment(p,mode),limitations=p.limitations||[];
 return exercises.filter(e=>e.equipment.every(item=>eq.includes(item)||(item==='chair'&&eq.includes('bench')))&&!e.restrictions.some(r=>limitations.includes(r)));
}
function programmeWeek(p,start){if(!p.programStart)return 1;return Math.max(1,Math.floor((new Date(start+'T12:00:00')-new Date(p.programStart+'T12:00:00'))/604800000)+1)}

function chooseExercise(p,pattern,options,phase){
 let pool=options.filter(e=>e.pattern===pattern);if(pattern==='pull'&&p.trainingMode==='body'&&p.level!=='beginner'){const pullup=options.find(e=>e.id==='pullup');if(pullup)return pullup;}if(!pool.length)return null;
 if(pattern==='push'&&!availableEquipment(p).includes('dumbbells')){const id=p.pushupAbility==='high'?'pushup':p.pushupAbility==='medium'?'incline-pushup':'wall-pushup';const match=pool.find(e=>e.id===id);if(match)return match}
 if(pattern==='squat'&&p.level==='beginner'){return pool.find(e=>e.id==='goblet-squat')||pool.find(e=>e.id==='chair-squat')||pool[0]}
 if(pattern==='verticalPull'&&p.level==='beginner')pool=pool.filter(e=>e.id!=='pullup');
 if(!pool.length)return null;
 const weighted=pool.filter(e=>e.equipment.some(x=>['dumbbells','barbell','cable','bands'].includes(x)));

 return pool[phase%pool.length];
}

 const isTimed=exercise.id==='plank';const range=isTimed?[20,40]:p.trainingGoal==='strength'&&p.level!=='beginner'&&['squat','push','pull','hinge','lunge','verticalPull'].includes(exercise.pattern)?[5,8]:p.trainingGoal==='endurance'?[12,18]:[8,12];
 if(!last)return {min:range[0],max:range[1],unit:isTimed?'сек':'повт.',weight:null,action:'start',note:isTimed?'Держи позицию только пока сохраняешь технику.':'Выбери сопротивление, с которым остаётся 2–3 повтора в запасе.',source:null};

function training(){return workoutUI.renderTraining()}
function filteredRecipes(){
 let list=recipes.filter(r=>recipeFilter==='Все'||r.tag===recipeFilter).filter(r=>profile.diet!=='vegetarian'||r.vegetarian).filter(r=>r.name.toLocaleLowerCase('ru').includes(recipeQuery.toLocaleLowerCase('ru')));
 if(recipeSort==='quick')list.sort((a,b)=>a.time-b.time);if(recipeSort==='protein')list.sort((a,b)=>b.protein-a.protein);
return list;
}
function recipesPage(){
 const list=filteredRecipes();
 return `${top('Вкусная сторона прогресса','56 рецептов: от шакшуки и сырников до карри, пасты и запечённой рыбы.')}${sceneBanner('food','Ешь ярко.<br>Чувствуй больше.','Настоящие ингредиенты, понятные шаги и десятки идей для каждого дня.','56 идей / без скуки')}
 <div class="recipe-controls"><label class="search-field"><span>⌕</span><input id="recipe-search" type="search" placeholder="Найти любимый рецепт…" aria-label="Поиск рецептов" value="${escape(recipeQuery)}"></label><select id="recipe-sort" aria-label="Сортировка рецептов"><option value="default" ${recipeSort==='default'?'selected':''}>По категориям</option><option value="quick" ${recipeSort==='quick'?'selected':''}>Сначала быстрые</option><option value="protein" ${recipeSort==='protein'?'selected':''}>Больше белка</option></select></div>
 <div class="section-head"><div class="tabs">${['Все',...mealTags].map(t=>`<button data-filter="${t}" class="${recipeFilter===t?'selected':''}">${t}</button>`).join('')}</div><span class="recipe-count">${list.length} рецептов</span></div><div class="recipe-grid">${list.map(recipeCard).join('')}</div>${!list.length?'<div class="empty">Ничего не найдено. Попробуй другой запрос или категорию.</div>':''}<p class="notice">В каталоге указана базовая порция. В меню ингредиенты и калорийность адаптируются под твой профиль.</p>`;
}

function basket(){const items=shopping(profile);return `${top('Твоя корзина на неделю','Всё для семи разных дней питания. Без лишних покупок.')}${sceneBanner('basket','Хорошая неделя<br>начинается здесь.','Все ингредиенты из твоего меню в одном списке. Отмечай купленное и забирай список с собой.','7 дней / 1 корзина')}<div class="panel"><div class="section-head"><h2>${items.length} продуктов · 1 человек</h2><button class="primary" id="download-basket">Скачать список ↓</button></div>${items.map((r,i)=>`<label class="basket-item"><input type="checkbox" data-check="${escape(r.name)}" ${checked.includes(r.name)?'checked':''}><b>${r.name}</b><span>${fmt(r.amount)} ${r.unit}</span></label>`).join('')}<p class="notice">Количество рассчитано из всех рецептов недельного меню с учётом твоих порций. Вес круп указан в сухом виде, нут — готовый. Соль, специи и вода не включены; округли покупки до доступных упаковок.</p><button class="text-button" id="reset-basket">Сбросить отметки ↺</button></div>`}
function render(){sceneManager.dispose();document.querySelector('#content').innerHTML=({overview,profile:profilePage,food,training,recipes:recipesPage,basket})[page]();document.querySelector('#crumb').textContent=names[page];document.querySelector('#account-name').textContent=profile.name;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));sceneManager.mount();syncSettings();}
function toast(message){const el=document.querySelector('#toast');el.textContent=message;el.classList.add('visible');setTimeout(()=>el.classList.remove('visible'),2800)}
function modal(html){document.querySelector('#modal-content').innerHTML=html;document.querySelector('#modal').hidden=false;document.body.style.overflow='hidden';document.querySelector('.close').focus()}
function close(){workoutUI.onClose();document.querySelector('#modal').hidden=true;document.querySelector('#modal-content').replaceChildren();document.body.style.overflow='';if(timerId)clearInterval(timerId)}
function showRecipe(r){modal(`<img class="modal-photo" src="${image(r)}" alt="${r.name}"><h2>${r.name}</h2><span class="badge">${r.kcal} ккал · ${r.time} мин · Б ${r.protein} / Ж ${r.fat} / У ${r.carbs} г</span><h3>Ингредиенты на порцию</h3>${r.ingredients.map(([n,a,u])=>`<div class="exercise"><b>${n}</b><span>${a} ${u}</span></div>`).join('')}<h3>Как приготовить</h3><ol>${r.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;location.hash=page;render();window.scrollTo({top:0,behavior:'smooth'})}if(b.dataset.recipe!==undefined)showRecipe(b.dataset.recipeDay!==undefined?dayMeals(profile,Number(b.dataset.recipeDay)).find(r=>r.id===Number(b.dataset.recipe)):recipes[Number(b.dataset.recipe)]);if(b.dataset.mealRecipe!==undefined)showRecipe(dayMeals(profile,day)[Number(b.dataset.mealRecipe)]);if(b.dataset.day!==undefined){day=Number(b.dataset.day);render()}if(b.dataset.mode){mode=b.dataset.mode;render()}if(b.dataset.filter){recipeFilter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('selected',el.dataset.filter===recipeFilter));updateRecipeResults()}if(b.dataset.eat!==undefined){const i=Number(b.dataset.eat);log.meals=log.meals.includes(i)?log.meals.filter(v=>v!==i):[...log.meals,i];save();render()}if(b.id==='water-add'){log.water=Math.round((log.water+.25)*100)/100;save();render();toast('Добавлено 250 мл воды')}if(b.id==='water-reset'){log.water=0;save();render()}if(b.id==='reset-basket'){checked=[];save();render()}if(b.id==='download-basket'){const text='FORMA · Корзина на 7 дней\n\n'+shopping(profile).map(r=>`${r.name} — ${r.amount} ${r.unit}`).join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='forma-shopping.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Список продуктов скачан')}if(b.id==='help')modal('<div class="eyebrow">ПРИВЕТ, ЭТО FORMA</div><h2>Твой ритм. Твоя форма.</h2><p>Заполни профиль, чтобы получить расчёт калорий и персональные порции. Отмечай еду и воду, выбирай тренировки и скачивай список покупок.</p><p>Расчёты приблизительные. Приложение не учитывает заболевания и не заменяет индивидуальную консультацию. Все данные сохраняются локально в браузере.</p>');if(b.classList.contains('close'))close();});
document.addEventListener('change',e=>{if(e.target.dataset.check){const key=e.target.dataset.check;checked=e.target.checked?[...checked,key]:checked.filter(v=>v!==key);save()}});
document.addEventListener('submit',e=>{if(e.target.id!=='profile-form')return;e.preventDefault();const data=Object.fromEntries(new FormData(e.target));for(const key of ['age','height','weight','activity'])data[key]=Number(data[key]);data.name=data.name.trim();try{workoutUI.captureProfile(e.target,data);if(!data.name)throw new Error('Укажи имя.');calculate(data);profile={...profile,...data,mealOverrides:{}};log.meals=[];checked=[];save();render();toast('Твой персональный план обновлён')}catch(err){document.querySelector('#form-error').textContent=err.message}});
document.querySelector('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.key==='Tab'&&!document.querySelector('#modal').hidden){const elements=[...document.querySelectorAll('#modal button, #modal a, #modal input')];const first=elements[0],last=elements.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('hashchange',()=>{const key=location.hash.slice(1);if(names[key]&&page!==key){page=key;render()}});if(names[location.hash.slice(1)])page=location.hash.slice(1);render();

document.querySelectorAll('#nav button').forEach(b=>b.setAttribute('aria-label',names[b.dataset.page]));

function syncSettings(){
 const themeButton=document.querySelector('#theme-toggle');themeButton.textContent=theme==='dark'?'☀ Светлая':'☾ Тёмная';themeButton.setAttribute('aria-label',theme==='dark'?'Включить бело-оранжевую тему':'Включить чёрно-красную тему');
 const motionButton=document.querySelector('#motion-toggle');motionButton.textContent=motion?'3D · ON':'3D · PAUSE';motionButton.setAttribute('aria-pressed',String(motion));
}
function resetMenuProgress(){log.meals=[];checked=[];save()}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.id==='theme-toggle'){theme=theme==='dark'?'light':'dark';document.documentElement.dataset.theme=theme;save();syncSettings()}
 if(b.id==='motion-toggle'){motion=!motion;document.documentElement.dataset.motion=motion?'on':'off';save();syncSettings()}
 if(b.id==='new-menu'){profile.menuVersion=(Number(profile.menuVersion)||0)+1;profile.mealOverrides={};resetMenuProgress();render();toast('Новый рацион готов. Корзина обновлена.')}
 if(b.dataset.swap!==undefined){pendingSlot=Number(b.dataset.swap);const current=dayMeals(profile,day)[pendingSlot];modal(`<div class="eyebrow">${mealTags[pendingSlot]}</div><h2>Что хочется сегодня?</h2><p>Выбери замену. Порции всего дня и недельная корзина обновятся.</p><div class="replacement-list">${candidates(profile,mealTags[pendingSlot]).map(r=>`<button class="replacement ${r.id===current.id?'current':''}" data-replace-id="${r.id}"><img src="${image(r)}" alt=""><span><b>${r.name}</b><small>${r.kcal} ккал · ${r.time} мин · базовая порция</small></span><i>${r.id===current.id?'✓':'+'}</i></button>`).join('')}</div>`)}
 if(b.dataset.replaceId!==undefined){profile.mealOverrides={...profile.mealOverrides,[`${day}-${pendingSlot}`]:Number(b.dataset.replaceId)};resetMenuProgress();close();render();toast('Блюдо заменено. Порции и корзина пересчитаны.')}
});
function updateRecipeResults(){
 const list=filteredRecipes();document.querySelector('.recipe-grid').innerHTML=list.map(recipeCard).join('');document.querySelector('.recipe-count').textContent=list.length+' рецептов';
 document.querySelector('.empty')?.remove();if(!list.length)document.querySelector('.recipe-grid').insertAdjacentHTML('afterend','<div class="empty">Ничего не найдено. Попробуй другой запрос или категорию.</div>');
}
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){recipeQuery=e.target.value;updateRecipeResults()}});
document.addEventListener('change',e=>{if(e.target.id==='recipe-sort'){recipeSort=e.target.value;updateRecipeResults()}});

})();
</script></body></html>
